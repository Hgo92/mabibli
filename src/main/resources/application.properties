spring.application.name=mabibli

# Connexion PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SUPABASE_DB_URL}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration = 1h
app.jwt.issuer=mabibli-api

# OpenLibrary
open-library.base-url=https://openlibrary.org
open-library.user-agent=${OPEN_LIBRARY_USER_AGENT:MaBibliotheque/1.0}
open-library.connect-timeout=2s
open-library.read-timeout=5s

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true